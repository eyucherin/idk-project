# knowledge_base/kb.yaml
spec_version: v1
kind: knowledge_base
name: scenario_kb
description: |
  watsonx.data Milvus knowledge base for the selected scenario.
prioritize_built_in_index: false
conversational_search_tool:
  language: ko
  query_rewrite:
    enabled: false
  index_config:
    - app_id: milvus_kb
      milvus:
        grpc_host: ffbe47d6-2f04-4c96-b0be-fdf8658d2a08.d2n23mhr0m94463g3tdg.lakehouse.ibmappdomain.cloud
        grpc_port: "31140"
        database: candidate02_l9x2n8pr
        collection: scenario_chunks
        index: embedding
        embedding_model_id: intfloat/multilingual-e5-large
        limit: 5
        field_mapping:
          title: source
          body: text
          url: source_url
          custom_fields:
            page: page
            chunk_id: chunk_id
  generation:
    enabled: true
    model_id: groq/openai/gpt-oss-120b
    prompt_instruction: |
      Answer only from retrieved Milvus chunks.
      For each claim, cite using ONLY the exact title (PDF filename) and page number from the retrieved metadata.
      Format: [문서명, p.{page}]
      Do NOT include chunk_id — do not invent or guess it.
      Do NOT cite source_url.
      If evidence is insufficient, say what is missing.
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
